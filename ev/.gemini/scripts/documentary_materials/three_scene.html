<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080">
<script src="vendor/gsap.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#eef3f5;color:#172932;font-family:Inter,Arial,sans-serif}
#main{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#ffffff 0,#f2f6f8 55%,#d8e3e8 100%)}
#webgl{position:absolute;inset:0;width:1920px;height:1080px;display:block}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(28,48,58,.08) 80%,rgba(18,34,42,.22) 100%);mix-blend-mode:multiply}
#header{position:absolute;left:72px;top:54px;max-width:820px;padding:16px 24px;border:1px solid rgba(117,158,181,.35);border-radius:12px;background:rgba(8,16,24,.82);backdrop-filter:blur(8px);z-index:4;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.eyebrow{font-size:14px;letter-spacing:.2em;font-weight:800;color:#94b8c9;text-transform:uppercase}
.title{font-size:34px;line-height:1.15;letter-spacing:-.02em;margin:8px 0 0;font-weight:850;color:#f3f7f8;text-shadow:0 2px 14px rgba(0,0,0,.7)}
/* The stage badge and the footer are template furniture, not documentary
   content. The badge carried a Turkish engineering label and the footer
   named the render technology. Both are removed from the markup so a 3D
   scene carries only the subject, the title and the engineering metric,
   and so no Turkish string remains in the rendered page. */
#metric{position:absolute;right:70px;bottom:70px;z-index:5;color:#f3f7f8;font-size:15px;letter-spacing:.1em;font-weight:800;background:rgba(8,16,24,.85);padding:10px 18px;border-radius:8px;border:1px solid rgba(117,158,181,.3);display:none}
</style>
</head>
<body>
<main id="main" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1920" data-height="1080">
<canvas id="webgl"></canvas><div id="vignette"></div>
<!-- The title card is kept in the markup for the scene script but never shown:
     the shot review blocks burned-in title text, and the default eyebrow named
     the Hyatt film on every other subject. -->
<header id="header" style="display:none"><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="title">__TITLE__</h1></header>
<div id="metric"></div>
</main>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";

const W=1920, H=1080, canvas=document.querySelector("#webgl");
const duration = __DURATION__;
const spec = __SPEC__ || {};

// Dynamic header updates
if(spec.title) document.getElementById("title").innerHTML = spec.title;
if(spec.caption) document.getElementById("eyebrow").textContent = spec.caption;
if(spec.metric) {
  const m = document.getElementById("metric");
  m.textContent = spec.metric;
  m.style.display = "block";
}

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false, powerPreference:"high-performance"});
renderer.setSize(W,H,false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f5f7);
scene.fog = new THREE.Fog(0xf0f5f7, 18, 45);

const camera = new THREE.PerspectiveCamera(36, W/H, 0.1, 100);

// Professional studio lighting
const hemi = new THREE.HemisphereLight(0xd4e9f5, 0x1a2630, 2.2);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff1db, 3.8);
keyLight.position.set(8, 14, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -10;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x48b0e0, 8, 24, 2);
rimLight.position.set(-10, 8, -8);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xbad4e0, 1.4);
fillLight.position.set(-8, -4, 6);
scene.add(fillLight);

const edgeMat = new THREE.LineBasicMaterial({color: 0x1a3340, transparent: true, opacity: 0.35});
const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({opacity: 0.18})
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -4.5;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

const RICH = (spec.objects || []).some(o => ["terrain","water","cone","sphere","house"].includes(o.type));
const LANDSCAPE = (spec.objects || []).some(o => o.type === "terrain" || o.type === "water");
if (LANDSCAPE) {
  scene.background = new THREE.Color(0xbcd7e8);
  scene.fog = new THREE.Fog(0xbcd7e8, 22, 60);
}

// Group holding all scene objects
const rootGroup = new THREE.Group();
scene.add(rootGroup);

const dynamicObjects = [];

function hash2(ix, iz, seed) {
  let n = ix * 374761393 + iz * 668265263 + seed * 1442695041;
  n = (n ^ (n >> 13)) * 1274126177;
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
}
function vnoise(x, z, seed) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz, seed), b = hash2(ix + 1, iz, seed), c = hash2(ix, iz + 1, seed), d = hash2(ix + 1, iz + 1, seed);
  return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z, seed) {
  return 0.5 * vnoise(x, z, seed) + 0.25 * vnoise(x * 2.1, z * 2.1, seed + 7) + 0.125 * vnoise(x * 4.3, z * 4.3, seed + 13);
}
// Heightmap terrain: u,v in -0.5..0.5 (v<0 is the far side); returns 0..1.
function terrainHeight(profile, u, v, seed) {
  const n = fbm(u * 5 + 3, v * 5 + 3, seed);
  const far = v + 0.5;                    // 0 near the camera, 1 far away
  if (profile === "valley") {
    const cx = 0.07 * Math.sin(v * 9 + seed) + 0.04 * Math.sin(v * 17);
    const d = Math.abs(u - cx);
    const wall = Math.min(1, Math.max(0, (d - 0.045) / 0.30));
    const base = 0.04 + 0.6 * Math.pow(wall, 1.3);
    return Math.min(1, base * (0.8 + 0.5 * far) + 0.13 * n * wall + 0.03 * n);
  }
  if (profile === "peak") {
    const r = Math.hypot(u * 1.15, (v + 0.08) * 1.25);
    const cone = Math.max(0, 1 - r / 0.62);
    const ridged = 1 - Math.abs(2 * fbm(u * 7 + 11, v * 7 + 5, seed) - 1);
    return Math.min(1, 0.04 + 0.78 * Math.pow(cone, 1.15) + 0.2 * ridged * cone + 0.04 * n);
  }
  if (profile === "ridge") {
    const ridgeline = 0.22 * Math.sin(u * 7 + seed) + 0.05;
    const d = Math.abs(v + 0.12 - ridgeline * 0.4);
    const r = Math.max(0, 1 - d / 0.48);
    const ridged = 1 - Math.abs(2 * fbm(u * 6 + 2, v * 6 + 9, seed) - 1);
    return Math.min(1, 0.05 + 0.65 * Math.pow(r, 1.2) * (0.75 + 0.35 * ridged) + 0.05 * n);
  }
  if (profile === "slope") {
    return Math.min(1, 0.05 + 0.7 * Math.pow(far, 1.3) + 0.12 * n);
  }
  return 0.04 + 0.05 * n;                  // flat
}
function heightColor(t, out) {
  const stops = [[0.0, 0x4d7a45], [0.2, 0x6f8f4e], [0.42, 0x8f7e5c], [0.62, 0x8d8a85], [0.9, 0xcfd8de], [1.0, 0xffffff]];
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const a = new THREE.Color(stops[i-1][1]), b = new THREE.Color(stops[i][1]);
      return out.copy(a).lerp(b, (t - stops[i-1][0]) / (stops[i][0] - stops[i-1][0]));
    }
  }
  return out.set(0xffffff);
}
function createTerrain(size, profile, seed, tint) {
  const SEG = 88;
  const geom = new THREE.PlaneGeometry(size[0], size[2], SEG, SEG);
  geom.rotateX(-Math.PI / 2);                 // y up, plane z runs -d/2..d/2
  const pos = geom.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const u = pos.getX(i) / size[0], v = pos.getZ(i) / size[2];
    const t = terrainHeight(profile, u, v, seed);
    pos.setY(i, t * size[1]);
    heightColor(t, c);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  geom.setAttribute("color", new THREE.BufferAttribute(col, 3));
  geom.computeVertexNormals();
  const g = new THREE.Group();
  const top = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({vertexColors: true, roughness: 0.95, metalness: 0.0}));
  top.castShadow = true; top.receiveShadow = true;
  g.add(top);
  // soil skirt on the four sides + base so the model reads as a solid diorama block
  const soil = new THREE.MeshStandardMaterial({color: 0x6b5442, roughness: 1, side: THREE.DoubleSide});
  const BOT = -0.5, edges = [];
  for (let k = 0; k <= SEG; k++) {          // PlaneGeometry vertex order: row (z) major
    edges.push([k, 0], [k, SEG]);
  }
  const sk = [], idx = [];
  function strip(pts) {                      // pts: list of vertex indices along one edge
    const base = sk.length / 3;
    pts.forEach(vi => { sk.push(pos.getX(vi), pos.getY(vi), pos.getZ(vi)); sk.push(pos.getX(vi), BOT, pos.getZ(vi)); });
    for (let j = 0; j < pts.length - 1; j++) {
      const a = base + 2*j, b = a + 1, c = a + 2, d = a + 3;
      idx.push(a, b, c, b, d, c);
    }
  }
  const W1 = SEG + 1, top0 = [], top1 = [], left = [], right = [];
  for (let k = 0; k <= SEG; k++) { top0.push(k); top1.push(SEG * W1 + k); left.push(k * W1); right.push(k * W1 + SEG); }
  [top0, top1, left, right].forEach(strip);
  const sg = new THREE.BufferGeometry();
  sg.setAttribute("position", new THREE.Float32BufferAttribute(sk, 3));
  sg.setIndex(idx); sg.computeVertexNormals();
  const skirt = new THREE.Mesh(sg, soil); skirt.castShadow = true; g.add(skirt);
  const base = new THREE.Mesh(new THREE.PlaneGeometry(size[0], size[2]), soil);
  base.rotation.x = Math.PI / 2; base.position.y = BOT; g.add(base);
  return g;
}

function createHouse(size, color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1] * 0.62, size[2]), new THREE.MeshStandardMaterial({color: color, roughness: 0.8, metalness: 0.05}));
  body.position.y = size[1] * 0.31; body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const roofH = size[1] * 0.38;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(size[0], size[2]) * 0.78, roofH, 4), new THREE.MeshStandardMaterial({color: 0x8a3b32, roughness: 0.85}));
  roof.rotation.y = Math.PI / 4; roof.position.y = size[1] * 0.62 + roofH / 2; roof.castShadow = true;
  g.add(roof);
  return g;
}

function createNutGeometry(radius, height) {
  // 6-sided hex nut with hollow bore
  const shape = new THREE.Shape();
  for(let i=0; i<6; i++) {
    const a = (i * Math.PI) / 3;
    const x = radius * Math.cos(a);
    const y = radius * Math.sin(a);
    if(i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  shape.closePath();
  // Inner hole
  const hole = new THREE.Path();
  const innerR = radius * 0.52;
  for(let i=0; i<32; i++) {
    const a = (i * Math.PI * 2) / 32;
    const x = innerR * Math.cos(a);
    const y = innerR * Math.sin(a);
    if(i === 0) hole.moveTo(x, y);
    else hole.lineTo(x, y);
  }
  hole.closePath();
  shape.holes.push(hole);
  const extrudeSettings = {depth: height, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.04, bevelThickness: 0.04};
  const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
  geom.center();
  geom.rotateX(Math.PI / 2);
  return geom;
}

function createThreadedRodGroup(radius, height, color) {
  const g = new THREE.Group();
  // Core shaft
  const shaftMat = new THREE.MeshStandardMaterial({color: color, metalness: 0.85, roughness: 0.22});
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.88, radius * 0.88, height, 32), shaftMat);
  shaft.castShadow = true; shaft.receiveShadow = true;
  g.add(shaft);
  // Helical thread rings
  const ringCount = Math.max(8, Math.floor(height / 0.18));
  const ringGeom = new THREE.TorusGeometry(radius * 0.95, 0.045, 8, 28);
  ringGeom.rotateX(Math.PI / 2);
  const ringMat = new THREE.MeshStandardMaterial({color: color, metalness: 0.9, roughness: 0.2});
  for(let i = 0; i < ringCount; i++) {
    const y = -height/2 + (i + 0.5) * (height / ringCount);
    const ring = new THREE.Mesh(ringGeom, ringMat);
    ring.position.y = y;
    g.add(ring);
  }
  return g;
}

// Build scene dynamically from spec.objects
const objectsSpec = spec.objects && spec.objects.length > 0 ? spec.objects : [];
let boundingBox = new THREE.Box3();

if (objectsSpec.length > 0) {
  objectsSpec.forEach(obj => {
    const type = obj.type;
    const pos = obj.position || [0,0,0];
    const endPos = obj.end_position || pos;
    const size = obj.size || [1,1,1];
    const hexColor = parseInt((obj.color || "#8398a3").replace("#",""), 16);
    
    let meshObj;
    const stdMat = new THREE.MeshStandardMaterial({
      color: hexColor,
      metalness: type === "box" ? 0.45 : 0.8,
      roughness: type === "box" ? 0.35 : 0.25
    });

    if (type === "box") {
      const geom = new THREE.BoxGeometry(size[0], size[1], size[2]);
      meshObj = new THREE.Mesh(geom, stdMat);
      meshObj.castShadow = true; meshObj.receiveShadow = true;
      const wire = new THREE.LineSegments(new THREE.EdgesGeometry(geom), edgeMat);
      meshObj.add(wire);
    } else if (type === "cylinder") {
      const radius = size[0] / 2;
      const height = size[1];
      const geom = new THREE.CylinderGeometry(radius, radius, height, 32);
      meshObj = new THREE.Mesh(geom, stdMat);
      meshObj.castShadow = true; meshObj.receiveShadow = true;
    } else if (type === "tube") {
      // An open bore (tunnel, pipe, shaft): the inside reads dark and the
      // wall shows its thickness at the open ends.
      const radius = size[0] / 2;
      const geom = new THREE.CylinderGeometry(radius, radius, size[1], 48, 1, true);
      meshObj = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({color: hexColor, metalness: 0.2, roughness: 0.7, side: THREE.DoubleSide}));
      meshObj.castShadow = true; meshObj.receiveShadow = true;
      const lining = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.92, radius * 0.92, size[1], 48, 1, true),
                                    new THREE.MeshStandardMaterial({color: 0x15181a, side: THREE.BackSide}));
      meshObj.add(lining);
    } else if (type === "nut") {
      const radius = size[0] / 2;
      const height = size[1];
      const geom = createNutGeometry(radius, height);
      meshObj = new THREE.Mesh(geom, stdMat);
      meshObj.castShadow = true; meshObj.receiveShadow = true;
    } else if (type === "terrain") {
      meshObj = createTerrain(size, obj.profile || "valley", Math.floor(Math.abs((pos[0]*7 + pos[2]*13 + size[1]*5))) % 97 + 3, hexColor);
    } else if (type === "water") {
      // thin translucent slab: river, lake, flood front. y = surface level.
      meshObj = new THREE.Mesh(new THREE.BoxGeometry(size[0], Math.min(size[1], 0.6), size[2]),
        new THREE.MeshStandardMaterial({color: hexColor === 0x8398a3 ? 0x2f86c4 : hexColor, metalness: 0.1, roughness: 0.12, transparent: true, opacity: 0.82}));
      meshObj.receiveShadow = true;
    } else if (type === "cone") {
      meshObj = new THREE.Mesh(new THREE.ConeGeometry(size[0] / 2, size[1], 40), stdMat);
      meshObj.material = new THREE.MeshStandardMaterial({color: hexColor, metalness: 0.05, roughness: 0.85});
      meshObj.castShadow = true; meshObj.receiveShadow = true;
    } else if (type === "sphere") {
      meshObj = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 24), new THREE.MeshStandardMaterial({color: hexColor, metalness: 0.05, roughness: 0.8}));
      meshObj.scale.set(size[0], size[1], size[2]);
      meshObj.castShadow = true; meshObj.receiveShadow = true;
    } else if (type === "house") {
      meshObj = createHouse(size, hexColor);
    } else if (type === "threaded_rod") {
      const radius = size[0] / 2;
      const height = size[1];
      meshObj = createThreadedRodGroup(radius, height, hexColor);
    }

    if (meshObj) {
      meshObj.position.set(pos[0], pos[1], pos[2]);
      const rot = obj.rotation || [0,0,0];
      meshObj.rotation.set(THREE.MathUtils.degToRad(rot[0]), THREE.MathUtils.degToRad(rot[1]), THREE.MathUtils.degToRad(rot[2]));
      rootGroup.add(meshObj);
      boundingBox.expandByObject(meshObj);
      dynamicObjects.push({
        mesh: meshObj,
        startPos: new THREE.Vector3(...pos),
        endPos: new THREE.Vector3(...endPos),
        hasMotion: (pos[0]!==endPos[0] || pos[1]!==endPos[1] || pos[2]!==endPos[2])
      });
    }
  });
} else {
  // Clean fallback overview model
  const boxMat = new THREE.MeshStandardMaterial({color: 0x7897a7, metalness: 0.5, roughness: 0.3});
  const m = new THREE.Mesh(new THREE.BoxGeometry(7, 0.4, 2.8), boxMat);
  m.castShadow = true; rootGroup.add(m);
  boundingBox.setFromObject(rootGroup);
}

// Adjust shadow plane based on bounding box
if (!boundingBox.isEmpty()) {
  shadowPlane.position.y = boundingBox.min.y - 0.25;
  if (!LANDSCAPE) {
    // ground disc: objects stand on something instead of floating in a white void
    const floor = new THREE.Mesh(new THREE.CircleGeometry(16, 64), new THREE.MeshStandardMaterial({color: 0xd5dfe3, roughness: 1, metalness: 0}));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = boundingBox.min.y - 0.26;
    floor.receiveShadow = true;
    scene.add(floor);
    const grid = new THREE.GridHelper(32, 32, 0x93a8b1, 0xb4c4cb);
    grid.position.y = boundingBox.min.y - 0.25;
    scene.add(grid);
  }
}

// Auto-fit camera framing
const center = new THREE.Vector3();
boundingBox.getCenter(center);
const bSize = new THREE.Vector3();
boundingBox.getSize(bSize);
const maxDim = Math.max(bSize.x, bSize.y, bSize.z, 2.5);

const baseDistance = maxDim * (LANDSCAPE ? 1.55 : 2.1);
const baseYawDeg = spec.camera_yaw !== undefined ? spec.camera_yaw : -28;
const baseYaw = (baseYawDeg * Math.PI) / 180;
const pitch = LANDSCAPE ? 0.5 : 0.32; // Slight downward angle

function updateCamera(u) {
  // Gentle, cinematic orbital pan (5 degrees over duration)
  const currentYaw = baseYaw + (u * 0.12);
  const camX = center.x + baseDistance * Math.sin(currentYaw) * Math.cos(pitch);
  const camY = center.y + baseDistance * Math.sin(pitch) + 0.3;
  const camZ = center.z + baseDistance * Math.cos(currentYaw) * Math.cos(pitch);
  camera.position.set(camX, camY, camZ);
  camera.lookAt(center);
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

function renderAt(time) {
  const u = Math.max(0, Math.min(1, time / Math.max(0.1, duration)));
  updateCamera(u);

  const motionFactor = easeInOut(u);
  dynamicObjects.forEach(item => {
    if (item.hasMotion) {
      item.mesh.position.lerpVectors(item.startPos, item.endPos, motionFactor);
    }
  });

  renderer.render(scene, camera);
}

window.addEventListener("hf-seek", e => renderAt(e.detail.time));
renderAt(window.__hfThreeTime || 0);

window.__timelines = window.__timelines || {};
const tl = gsap.timeline({paused: true});
tl.from("#header", {opacity: 0, y: 16, duration: Math.min(0.5, duration * 0.1)}, 0.01);

if (spec.metric) {
  tl.from("#metric", {opacity: 0, y: 10, duration: 0.4}, Math.min(0.8, duration * 0.25));
}

window.__timelines.main = tl;
window.__documentaryScene = {ready: true, title: spec.title || "__TITLE__", duration: duration};
</script>
</body>
</html>
